name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the dmgs to (e.g. v1.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14        # Apple Silicon
          - arch: x86_64
            runner: macos-15-intel  # Intel (macos-13 is retired; retired labels fail fast)
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Build app and dmg
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HumanTyper-mac-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
